<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>arenalaunch</title>
<meta name="theme-color" content="#07080c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07080c;--well:#0a0b10;--ink:#f2f4f8;--mute:#8a90a6;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--acc:#c4ff3d;--acc2:#d8ff7a;--accink:#0b1200;--err:#ff6370;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter',system-ui,sans-serif;padding:16px;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 400px at 50% 30%,rgba(196,255,61,.1),transparent 70%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent)}
  form{width:min(400px,100%);border:1px solid var(--line2);border-radius:24px;padding:32px;background:linear-gradient(180deg,rgba(21,24,33,.9),rgba(13,15,21,.95));box-shadow:0 40px 90px -40px #000}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .brand i{width:38px;height:38px;border-radius:11px;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 26px -8px rgba(196,255,61,.7)}
  .brand i::before{content:'';border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid var(--accink);transform:translateY(-1px)}
  h1{margin:0;font-family:'Archivo',sans-serif;font-weight:900;font-size:34px;letter-spacing:-.03em;font-variation-settings:'wdth' 80;line-height:1}
  h1 b{color:var(--acc)}
  .sub{font-size:13.5px;color:var(--mute);margin:10px 0 26px}
  label{font-size:12.5px;font-weight:600;color:#c3c8d6;display:block;margin-bottom:8px}
  input{width:100%;background:var(--well);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:16px;padding:13px 14px;outline:none;border-radius:12px;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(196,255,61,.12)}
  button{width:100%;margin-top:14px;background:var(--acc);border:0;color:var(--accink);padding:15px;font-family:'Archivo',sans-serif;font-weight:900;font-size:17px;border-radius:14px;cursor:pointer;box-shadow:0 14px 34px -14px rgba(196,255,61,.85);transition:background .15s}
  button:hover:not(:disabled){background:var(--acc2)} button:disabled{opacity:.5;cursor:wait}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .err{color:var(--err);font-size:13px;min-height:20px;margin-top:12px;text-align:center}
</style></head>
<body><form id="f">
  <div class="brand"><i></i><h1>arena<b>launch</b></h1></div>
  <div class="sub">Squad launches on pump.fun · private beta</div>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button id="go" type="submit">Enter</button>
  <div class="err" id="err"></div>
</form>
<script src="/gate.js"></script></body></html>
